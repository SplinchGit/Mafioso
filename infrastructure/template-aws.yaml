AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mafioso AWS-only web game stack

Parameters:
  Stage:
    Type: String
    Default: staging
    AllowedValues: [dev, staging, prod]
  JWTSecretArn:
    Type: String
    Description: ARN of the Mafioso JWT secret in AWS Secrets Manager

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        PLAYERS_TABLE: !Ref PlayersTable
        COOLDOWNS_TABLE: !Ref CooldownsTable
        CRIME_HISTORY_TABLE: !Ref CrimeHistoryTable
        CITY_PROPS_TABLE: !Ref CityPropsTable
        CAR_LISTINGS_TABLE: !Ref CarListingsTable
        JWT_SECRET_ARN: !Ref JWTSecretArn
        JWT_SECRET: !Sub '{{resolve:secretsmanager:${JWTSecretArn}:SecretString}}'

Resources:
  MafiosoApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'mafioso-${Stage}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: preferred_username
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'mafioso-${Stage}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mafioso-${Stage}-players-v2'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: worldId
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: worldId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: username-index
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CooldownsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mafioso-${Stage}-cooldowns-v2'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: playerId
          AttributeType: S
        - AttributeName: crimeId
          AttributeType: N
      KeySchema:
        - AttributeName: playerId
          KeyType: HASH
        - AttributeName: crimeId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  CrimeHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mafioso-${Stage}-crime-history-v2'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CityPropsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mafioso-${Stage}-city-props-v2'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: propId
          AttributeType: S
      KeySchema:
        - AttributeName: propId
          KeyType: HASH

  CarListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mafioso-${Stage}-car-listings-v2'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CognitoSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/auth/
      Handler: cognitoSession.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JWTSecretArn
      Events:
        Session:
          Type: Api
          Properties:
            RestApiId: !Ref MafiosoApi
            Path: /api/auth/session
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  ValidateTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/auth/
      Handler: validateToken.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JWTSecretArn
      Events:
        Validate:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/auth/validate, Method: get }

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/player/
      Handler: getProfile.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PlayersTable }
      Events:
        Profile:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/player/profile, Method: get }

  CommitCrimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/crimes/
      Handler: commitCrime.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CooldownsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CrimeHistoryTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JWTSecretArn
      Events:
        CommitCrime:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/crimes/commit, Method: post }

  BuyGunFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/player/
      Handler: buyGun.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        BuyGun:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/player/buy-gun, Method: post }

  BuyProtectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/player/
      Handler: buyProtection.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        BuyProtection:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/player/buy-protection, Method: post }

  SwissBankFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/player/
      Handler: swissBank.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        SwissBank:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/player/swiss-bank, Method: post }

  TravelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/player/
      Handler: travel.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Travel:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/player/travel, Method: post }

  SearchPlayerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/combat/
      Handler: searchPlayer.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Search:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/combat/search-player, Method: post }

  ShootPlayerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/combat/
      Handler: shootPlayer.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Shoot:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/combat/shoot-player, Method: post }

  CancelSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/combat/
      Handler: cancelSearch.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        CancelSearch:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/combat/cancel-search, Method: post }

  GetCarsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/garage/
      Handler: getCars.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Cars:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/garage/cars, Method: get }

  ActivateCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/garage/
      Handler: activateCar.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Activate:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/garage/activate, Method: post }

  RepairCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/garage/
      Handler: repairCar.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Repair:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/garage/repair, Method: post }

  MeltCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/garage/
      Handler: meltCar.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
      Events:
        Melt:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/garage/melt, Method: post }

  SearchListingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/marketplace/
      Handler: searchListings.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CarListingsTable }
      Events:
        Listings:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/marketplace/listings, Method: get }

  ListCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/marketplace/
      Handler: listCar.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CarListingsTable }
      Events:
        ListCar:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/marketplace/list, Method: post }

  BuyCarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/marketplace/
      Handler: buyCar.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CarListingsTable }
      Events:
        BuyCar:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/marketplace/buy, Method: post }

  GetCityPropsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/props/
      Handler: getCityProps.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PlayersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CityPropsTable }
      Events:
        Props:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/props, Method: get }

  ClaimPropFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/backend/functions/props/
      Handler: claimProp.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlayersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CityPropsTable }
      Events:
        ClaimProp:
          Type: Api
          Properties: { RestApiId: !Ref MafiosoApi, Path: /api/props/claim, Method: post }

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'mafioso-${Stage}-${AWS::AccountId}-${AWS::Region}-web-v2'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'mafioso-${Stage}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: WebS3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: GameApi
            DomainName: !Sub '${MafiosoApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: !Sub '/${Stage}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: WebS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies: { Forward: none }
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: GameApi
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            ForwardedValues:
              QueryString: true
              Headers: [Authorization, Origin, Content-Type]
              Cookies: { Forward: none }
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${MafiosoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebBucketName:
    Value: !Ref WebBucket
  CloudFrontDistributionId:
    Value: !Ref WebDistribution
  WebUrl:
    Value: !Sub 'https://${WebDistribution.DomainName}'
