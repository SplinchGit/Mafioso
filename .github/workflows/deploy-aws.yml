name: Deploy Mafioso to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mafioso-aws-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: '620214494442'
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::620214494442:role/mafioso-github-deploy
      SAM_ARTIFACT_BUCKET: mafioso-sam-artifacts-620214494442-eu-west-2
      STACK_NAME: mafioso-backend-prod
      STAGE: prod
      MAFIOSO_OWNER_EMAIL: casualjfo7@gmail.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: aws-actions/setup-sam@v2

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mafioso-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Refuse wrong AWS account
        shell: bash
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "AWS account: $ACTUAL_ACCOUNT"
          test "$ACTUAL_ACCOUNT" = "$AWS_ACCOUNT_ID"

      - name: Build backend and Lambda dependency layer
        working-directory: backend
        run: |
          npm ci
          npx jest --runInBand
          npm run build
          npm ci --omit=dev --prefix layer/nodejs

      - name: Validate AWS-only SAM template
        run: sam validate --template-file infrastructure/template-aws.yaml --region "$AWS_REGION"

      - name: Build deployable SAM artifacts
        run: sam build --template-file infrastructure/template-aws.yaml --region "$AWS_REGION"

      - name: Deploy backend and infrastructure
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --parameter-overrides Stage="$STAGE" OwnerEmail="$MAFIOSO_OWNER_EMAIL"

      - name: Read stack outputs
        id: outputs
        shell: bash
        run: |
          output() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "user_pool_id=$(output UserPoolId)" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$(output UserPoolClientId)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(output ApiUrl)" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$(output WebBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(output CloudFrontDistributionId)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(output WebUrl)" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ steps.outputs.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.outputs.outputs.user_pool_client_id }}
          VITE_API_ENDPOINT: ${{ steps.outputs.outputs.web_url }}
        run: |
          npm ci
          npm run build

      - name: Publish frontend to S3
        run: aws s3 sync frontend/dist "s3://${{ steps.outputs.outputs.web_bucket }}" --delete

      - name: Invalidate CloudFront
        shell: bash
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution_id }}" --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "${{ steps.outputs.outputs.distribution_id }}" --id "$INVALIDATION_ID"

      - name: Smoke test live game
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.outputs.outputs.web_url }}/" > /dev/null
          echo "Mafioso is live at ${{ steps.outputs.outputs.web_url }}"
